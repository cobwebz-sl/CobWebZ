<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24">
  <!-- A snowflake for the December snow (script.js, initHeroField): six arms, each with two
       pairs of branches. snowflake.svg is for the dark theme. -->
  <defs>
    <g id="arm" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round">
      <path d="M0 0V-10.5M0-6.5-3.2-9.6M0-6.5 3.2-9.6M0-3-2.2-5M0-3 2.2-5"/>
    </g>
  </defs>
  <use href="#arm"/><use href="#arm" transform="rotate(60)"/><use href="#arm" transform="rotate(120)"/>
  <use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(240)"/><use href="#arm" transform="rotate(300)"/>
</svg>
