<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- Same policy as the other pages; the inline theme script is allowed by its hash. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-xTpUMg0MuPhQ5EP+in6S98erupmmXU1YGA784+uUY90='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — CobWebZ</title>
  <meta name="description" content="That page doesn't exist on the CobWebZ site. Head back to the homepage or browse our work.">
  <!-- Cloudflare Pages and Netlify serve this file for missing URLs. Search engines must not list it. -->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f0f1f3">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <script>document.documentElement.classList.add('js');try{if(localStorage.getItem('theme')==='dark'){document.documentElement.dataset.theme='dark';document.querySelector('meta[name="theme-color"]').content='#0c0d10'}}catch(e){}</script>

  <!-- Absolute paths: a missing URL can be at any depth, e.g. /pizza/menu -->
  <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/variables.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    .notfound { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 48px 16px; }
    .notfound__code { font-family: 'Geist Mono', monospace; font-size: 14px; color: var(--color-muted); letter-spacing: 0.08em; }
    .notfound .hero__actions { justify-content: center; }
  </style>
</head>

<body>
  <main id="main" class="notfound">
    <div class="container-cube">
      <p class="notfound__code">404</p>
      <h1 class="hero__title">Nothing here <span class="accent">but cobwebs.</span></h1>
      <p class="hero__lead">The page you asked for doesn't exist or has moved.</p>
      <div class="hero__actions">
        <a href="/" class="btn btn--primary btn--lg">Back to the homepage</a>
        <a href="/work.html" class="hero__note">See our work <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </main>
</body>

</html>
